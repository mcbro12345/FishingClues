name: Bug report
description: Report a reproducible Fishing Clues problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Fishing Clues. Please avoid posting private account information in diagnostics.
  - type: input
    id: version
    attributes:
      label: Fishing Clues version
      placeholder: 3.9.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem appeared?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or logs
      description: Paste relevant output from /fishingclues diagnostics or Dalamud logs if useful and safe to share.
      render: text
