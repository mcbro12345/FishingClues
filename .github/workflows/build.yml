name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Dalamud
        shell: pwsh
        run: |
          $dest = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:TEMP\dalamud-latest.zip"
          Expand-Archive -Path "$env:TEMP\dalamud-latest.zip" -DestinationPath $dest -Force

      - name: Restore
        run: dotnet restore FishingClues/FishingClues.csproj

      - name: Build
        run: dotnet build FishingClues/FishingClues.csproj -c Release --no-restore
